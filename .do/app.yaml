# DigitalOcean App Platform — full stack (React + FastAPI on one hostname).
#
# APPLY THIS SPEC (replaces a single-service API-only deploy from repo-root Dockerfile):
#   1) Apps → your app → Settings → App spec → Edit, paste this entire file, Save.
#   2) Or: doctl apps update <APP_ID> --spec .do/app.yaml
# If the app has a managed DB or other components not listed below, merge those stanzas
# into the spec in the UI before saving so they are not removed.
#
# After deploy: / and /login → web (nginx); /api, /docs, /uploads, /health → api.
# If the default .ondigitalocean.app URL changes, update every https://… below the same way.
#
# Secrets (UI or doctl only, never commit): DATABASE_URL, JWT_SECRET

name: gym-management
region: nyc

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /docs
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /redoc
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /openapi.json
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /uploads
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

alerts:
  - rule: DEPLOYMENT_FAILED

services:
  - name: api
    github:
      repo: Lishithaa/GYM-MANAGEMENT
      branch: Develop
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: RUN_TIME
        type: general
      # Same-origin SPA + API (override in UI if you use a custom domain)
      - key: FRONTEND_URL
        value: https://sea-lion-app-gpcie.ondigitalocean.app
        scope: RUN_TIME
        type: general
      - key: PUBLIC_BACKEND_URL
        value: https://sea-lion-app-gpcie.ondigitalocean.app
        scope: RUN_TIME
        type: general
      - key: CORS_ORIGINS
        value: https://sea-lion-app-gpcie.ondigitalocean.app
        scope: RUN_TIME
        type: general

  - name: web
    github:
      repo: Lishithaa/GYM-MANAGEMENT
      branch: Develop
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Must match public app URL (config.js builds API = BACKEND_URL + /api)
      - key: REACT_APP_BACKEND_URL
        value: https://sea-lion-app-gpcie.ondigitalocean.app
        scope: BUILD_TIME
        type: general
