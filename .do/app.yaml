# DigitalOcean App Platform — import this repo or run: doctl apps create --spec .do/app.yaml
# Replace github.repo with your org/repo if different. Branch is set to Develop (screenshot).
#
# After first deploy, set the web service BUILD_TIME env REACT_APP_BACKEND_URL to your app URL
# (same origin if using ingress below), e.g. https://hourlygym-xxxxx.ondigitalocean.app
#
# Name must match: ^[a-z][a-z0-9-]{0,30}[a-z0-9]$

name: hourlygym
region: nyc

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

alerts:
  - rule: DEPLOYMENT_FAILED

services:
  - name: api
    github:
      repo: Lishithaa/GYM-MANAGEMENT
      branch: Develop
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: RUN_TIME
        type: general

  - name: web
    github:
      repo: Lishithaa/GYM-MANAGEMENT
      branch: Develop
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Set after API URL is known, or use same-origin app URL for combined ingress.
      - key: REACT_APP_BACKEND_URL
        value: https://REPLACE_WITH_YOUR_APP_PUBLIC_URL
        scope: BUILD_TIME
        type: general
