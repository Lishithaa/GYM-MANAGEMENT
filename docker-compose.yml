# HourlyGym — from repo root: docker compose up --build
# Prereq: copy backend/.env.example → backend/.env (DATABASE_URL, JWT_SECRET, etc.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override when frontend is reached at a public URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-visible API origin (no /api suffix)
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
